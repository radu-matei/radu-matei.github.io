baseurl = "https://radu-matei.com"
languageCode = "en-us"
title = "radu's blog"
theme = "hugo-xmin"
paginator.pagerSize = 5
copyright = "Radu Matei"
defaultContentLanguage = "en"
enableRobotsTXT = true

[author]
name = "Radu Matei"
email = "radu@matei.ai"

[params]
name = "Radu Matei"
description = "Radu Matei — engineer and founder. Writing on systems, WebAssembly, and the craft of building software."
github = "radu-matei"
twitter = "matei_radu"
bluesky = "radu-matei.com"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false


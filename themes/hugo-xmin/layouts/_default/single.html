{{ partial "header.html" . }}
<main class="post">
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <p class="post-meta">
        <a href="/">{{ .Site.Params.name }}</a>
        {{- if not .Date.IsZero }}
        <span class="dot">·</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2006" }}</time>
        {{- end }}
        {{- if ne .Section "changelog" }}<span class="dot">·</span>{{ .ReadingTime }} min read{{ end }}
      </p>
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
</main>
{{ partial "footer.html" . }}

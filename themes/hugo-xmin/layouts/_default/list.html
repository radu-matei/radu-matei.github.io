{{ partial "header.html" . }}
<main class="archive">
  <h1 class="page-title">{{ if eq .Section "blog" }}Writing{{ else }}{{ .Title }}{{ end }}</h1>
  {{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
  {{ range .RegularPages.GroupByDate "2006" }}
  <section class="year-group">
    <h2 class="year-label">{{ .Key }}</h2>
    <ul class="post-list">
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</main>
{{ partial "footer.html" . }}
